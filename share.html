<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss Timer Share</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px 18px 30px;background:#090a0c;color:#f5f5f5;font:13px Arial,Helvetica,sans-serif;max-width:1500px;margin:auto}.header{display:flex;align-items:center;gap:12px;margin-bottom:14px}.title{font-size:23px;font-weight:800}.badge{font-size:11px;color:#9ca2aa;border:1px solid #343941;border-radius:999px;padding:5px 9px}.expires{margin-left:auto;color:#9ca2aa;font-size:11px}.table{border:1px solid #2a2d31;border-radius:9px;overflow:hidden;background:#0b0d10}.head,.row{display:grid;grid-template-columns:minmax(260px,1.2fr) 120px 55px 170px;align-items:center}.head{min-height:42px;padding:0 18px;background:#0d0f12;color:#aab0b8;font-size:11px;text-transform:uppercase}.row{min-height:64px;padding:7px 18px;border-top:1px solid #272a2e}.row:nth-child(odd){background:#100c0d}.name{font-size:15px;font-weight:800}.detail{margin-top:5px;color:#9ca2aa;font-size:11px}.v{color:#43c56b;font-weight:700}.timer{text-align:right}.main{font-size:16px;font-weight:800;color:#ffd400}.sub{color:#969ca4;font-size:11px;margin-top:4px}.status{text-align:center;color:#ffd400;font-size:18px}.error{max-width:600px;margin:80px auto;text-align:center;background:#181c21;border:1px solid #343941;border-radius:9px;padding:24px;color:#ff8179}.empty{text-align:center;padding:35px;color:#777}@media(max-width:700px){body{padding:8px}.head,.row{grid-template-columns:minmax(150px,1fr) 80px 35px 120px;padding-left:9px;padding-right:9px}.name{font-size:12px}.detail,.sub{font-size:8px}.main{font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://jdgzjsejlzmsghfeveel.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_v0bjeJ8wfzb5AYjslHcUYA_nRomPTqz";
const sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const token = new URLSearchParams(location.search).get("token");
let bosses=[];
function fmt(ms){if(ms<=0)return"SPAWNED";let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(expiresAt){
 const now=Date.now();
 document.getElementById("app").innerHTML=`<div class="header"><div class="title">BOSS TIMER</div><div class="badge">VIEW ONLY</div><div class="expires">Share expires: ${new Date(expiresAt).toLocaleString("en-GB")}</div></div><div class="table"><div class="head"><div>BOSS</div><div>STATUS</div><div></div><div style="text-align:right">NEXT SPAWN</div></div>${bosses.length?bosses.map(b=>{const rem=Number(b.next_spawn)-now;const spawned=rem<=0;return `<div class="row"><div><div class="name">${esc(b.name)}</div><div class="detail">Cycle: <span class="v">${String(b.hh).padStart(2,"0")}:${String(b.mm).padStart(2,"0")}</span> &nbsp;|&nbsp; Respawn: <span class="v">${b.rh}j ${b.rm}m</span></div></div><div>${spawned?"SPAWNED":""}</div><div class="status">${spawned?"🔔":""}</div><div class="timer"><div class="main">${fmt(rem)}</div><div class="sub">${new Date(b.next_spawn).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}</div></div></div>`}).join(""):"<div class='empty'>Tidak ada boss.</div>"}</div>`;
}
async function load(){
 if(!token){document.getElementById("app").innerHTML='<div class="error">Invalid share link.</div>';return false}
 const {data,error}=await sb.rpc("get_timer_share",{p_token:token});
 if(error){document.getElementById("app").innerHTML='<div class="error">Share link error.<br>'+esc(error.message)+'</div>';return false}
 if(!data){document.getElementById("app").innerHTML='<div class="error">This share link has expired or is invalid.</div>';return false}
 bosses=Array.isArray(data.bosses)?data.bosses:[];
 if(Date.parse(data.expires_at)<=Date.now()){document.getElementById("app").innerHTML='<div class="error">This share link has expired.</div>';return false}
 render(data.expires_at);return true;
}
(async()=>{if(await load()){setInterval(async()=>{const ok=await load();if(!ok) location.reload()},2000);}})();
</script>
</body>
</html>
