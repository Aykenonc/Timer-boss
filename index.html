<script>
/*
  BOSS TIMER - ONLINE VERSION
  Replace the two values below with your own Supabase Project URL
  and Publishable Key before uploading to GitHub Pages.
*/
const SUPABASE_URL = "https://jdgzjsejlzmsghfeveel.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_v0bjeJ8wfzb5AYjslHcUYA_nRomPTqz";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* AUTH UI + role gate. Server-side RLS for bosses is still required for true view-only security. */
const AUTH_PROFILE_TABLE = "user_profiles";
const $ = id => document.getElementById(id);
let currentProfile = null;
let authReady = false;

function setAdminUI(isAdmin){
  document.body.classList.toggle("auth-member", !isAdmin);
}

async function loadCurrentProfile(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return null;
  const {data,error} = await sb.from(AUTH_PROFILE_TABLE)
    .select("user_id,username,role,status,login_email")
    .eq("user_id",user.id)
    .maybeSingle();
  if(error) throw error;
  if(!data) throw new Error("Profile user belum terdaftar.");
  if(data.status !== "active") throw new Error("Akun ini dinonaktifkan.");
  return data;
}

async function showAuthenticatedApp(profile){
  currentProfile = profile;
  authReady = true;
  $("authGate").hidden = true;
  $("authUsernameLabel").textContent = profile.username || "";
  $("authRoleLabel").textContent = profile.role === "admin" ? "ADMIN" : "MEMBER";
  $("logoutBtn").style.display = "inline-block";
  setAdminUI(profile.role === "admin");
  await loadBosses();
}

async function showLogin(){
  authReady = false;
  currentProfile = null;
  $("authGate").hidden = false;
  $("logoutBtn").style.display = "none";
  setAdminUI(false);
  $("authUsername").focus();
}

async function loginWithUsername(){
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;
  const errBox = $("authError");
  const btn = $("authLoginBtn");
  errBox.textContent = "";
  if(!username || !password){
    errBox.textContent = "Please enter username and password.";
    return;
  }
  btn.disabled = true;
  btn.textContent = "Logging in...";
  try{
    const {data:loginEmail,error:lookupError} = await sb.rpc("get_login_email", {p_username: username});
    if(lookupError) throw lookupError;
    if(!loginEmail) throw new Error("Invalid username or password.");
    const {error:signInError} = await sb.auth.signInWithPassword({email:loginEmail,password});
    if(signInError) throw new Error("Invalid username or password.");
    const profile = await loadCurrentProfile();
    await showAuthenticatedApp(profile);
  }catch(e){
    console.error(e);
    await sb.auth.signOut();
    const msg = String(e?.message || "");
    if(/dinonaktifkan|disabled/i.test(msg)) errBox.textContent = "This account is disabled.";
    else errBox.textContent = "Invalid username or password.";
  }finally{
    btn.disabled = false;
    btn.textContent = "Login to Timer";
  }
}

$("authForm").addEventListener("submit", e=>{ e.preventDefault(); loginWithUsername(); });
$("authEye").addEventListener("click", ()=>{
  const p=$("authPassword"); const show=p.type === "password"; p.type=show ? "text" : "password";
  $("authEye").textContent=show ? "◉" : "◉";
  $("authEye").setAttribute("aria-label", show ? "Hide password" : "Show password");
});
$("authPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") loginWithUsername(); });
$("authUsername").addEventListener("keydown", e=>{ if(e.key==="Enter") $("authPassword").focus(); });
$("logoutBtn").addEventListener("click", async()=>{ await sb.auth.signOut(); location.reload(); });

sb.auth.onAuthStateChange(async (event, session)=>{
  if(event === "SIGNED_OUT"){
    if(authReady) location.reload();
    return;
  }
  if(session && !authReady){
    try{
      const profile = await loadCurrentProfile();
      await showAuthenticatedApp(profile);
    }catch(e){
      console.error(e);
      await sb.auth.signOut();
      await showLogin();
    }
  }
});

function updateHistoryButtons(){
  const u=$("undoBtn"), r=$("redoBtn");
  if(u) u.disabled = undoStack.length===0 || historyBusy;
  if(r) r.disabled = redoStack.length===0 || historyBusy;
}

function pushHistory(entry){
  if(historyBusy) return;
  undoStack.push(entry);
  if(undoStack.length>50) undoStack.shift();
  redoStack=[];
  updateHistoryButtons();
}

async function undoAction(){
  if(!undoStack.length || historyBusy) return;
  const entry=undoStack.pop();
  historyBusy=true; updateHistoryButtons();
  try{
    await entry.undo();
    redoStack.push(entry);
  }catch(err){
    undoStack.push(entry);
    alert("Undo gagal: " + (err.message || err));
  }finally{
    historyBusy=false;
    updateHistoryButtons();
  }
}

async function redoAction(){
  if(!redoStack.length || historyBusy) return;
  const entry=redoStack.pop();
  historyBusy=true; updateHistoryButtons();
  try{
    await entry.redo();
    undoStack.push(entry);
  }catch(err){
    redoStack.push(entry);
    alert("Redo gagal: " + (err.message || err));
  }finally{
    historyBusy=false;
    updateHistoryButtons();
  }
}

document.addEventListener("keydown", e=>{

async function catchUpOverdueBosses(){
  const now=Date.now();
  const overdue=bosses.filter(b=>b.next && b.respawn>0 && now>=b.next+(globalAutoKillSeconds*1000));
  for(const b of overdue){
    const oldNext=b.next;
    const next=now+b.respawn;
    const visual=getAutoSpawnVisual();
    delete visual[String(b.id)];
    setAutoSpawnVisual(visual);
    b.next=next;
    const {error}=await sb.from("bosses")
      .update({next_spawn:next})
      .eq("id",b.id)
      .lt("next_spawn",now+1);
    if(error){
      b.next=oldNext;
      console.error("Catch-up auto-kill failed:", error);
    }else{
      const status=getAutoStatus();
      status[String(b.id)]=true;
      setAutoStatus(status);
    }
  }
}

async function loadBosses(){
  if(loading) return;
  loading = true;
  try{
    const [{data, error}, {data:hiddenRows, error:hiddenError}] = await Promise.all([
      sb.from("bosses").select("*").order("next_spawn", {ascending:true}),
      sb.from("boss_hidden").select("boss_id")
    ]);
    if(error) throw error;
    if(hiddenError) throw hiddenError;
    sharedHidden = new Set((hiddenRows || []).map(r => String(r.boss_id)));

    if(!data || data.length === 0){
      const seed = INITIAL_BOSSES.map(b => toRow({
        ...b,
        location: b.location || "Unmapped",
        autoKill: b.autoKill !== false,
        autoDelay: globalAutoKillSeconds
      }));
      const {error: seedError} = await sb.from("bosses").insert(seed);
      if(seedError) throw seedError;
      const again = await sb.from("bosses").select("*").order("next_spawn", {ascending:true});
      if(again.error) throw again.error;
      const rows = again.data || [];
      if(rows.length) globalAutoKillSeconds = Math.max(0, Number(rows[0].auto_delay) || AUTO_KILL_DEFAULT_SECONDS);
      localStorage.setItem(GLOBAL_AUTO_KILL_KEY,String(globalAutoKillSeconds));
      bosses = rows.map(fromRow);
    }else{
      const dbDelayValues = data.map(r=>Number(r.auto_delay)).filter(Number.isFinite);
      const allSame = dbDelayValues.length === data.length && dbDelayValues.every(v=>v===dbDelayValues[0]);
      const firstDelay = allSame ? dbDelayValues[0] : null;
      const hasSavedGlobal = localStorage.getItem(GLOBAL_AUTO_KILL_KEY) !== null;
      // V22 stored the old default as 1 minute. On the first run of this version,
      // migrate that legacy value to the new 20-second global default once.
      if(!hasSavedGlobal && firstDelay===1){
        globalAutoKillSeconds = AUTO_KILL_DEFAULT_SECONDS;
        localStorage.setItem(GLOBAL_AUTO_KILL_KEY,String(globalAutoKillSeconds));
        const {error:delayError}=await sb.from("bosses").update({auto_delay:globalAutoKillSeconds}).not("id","is",null);
        if(delayError) console.error("Legacy delay migration failed:", delayError);
      }else if(firstDelay!==null){
        globalAutoKillSeconds = Math.max(0, firstDelay);
        localStorage.setItem(GLOBAL_AUTO_KILL_KEY,String(globalAutoKillSeconds));
      }
      bosses = data.map(fromRow);
    }
    bosses.forEach(b=>b.autoDelay=globalAutoKillSeconds);
    await catchUpOverdueBosses();
    render();
  }catch(err){
    console.error(err);
    alert("Gagal terhubung ke database Supabase.\n\n" + (err.message || err));
  }finally{
    loading = false;
  }
}

function calcNext(h,m,respawnMs){
  const now=Date.now();
  const base=new Date();
  base.setHours(h,m,0,0);

  // Treat Cycle Start as the last-kill time. If today's time has not
  // happened yet, the last occurrence was yesterday. Then advance by
  // the respawn interval until the next spawn is in the future.
  let t=base.getTime();
  if(t>now) t-=24*60*60000;

  if(respawnMs<=0) return t;
  while(t<=now) t+=respawnMs;
  return t;
}

async function setHiddenState(b,wanted){
  const key=String(b.id);
  if(wanted){
    const {error}=await sb.from("boss_hidden").upsert({boss_id:key},{onConflict:"boss_id"});
    if(error)throw error;
    sharedHidden.add(key);
  }else{
    const {error}=await sb.from("boss_hidden").delete().eq("boss_id",key);
    if(error)throw error;
    sharedHidden.delete(key);
  }
  b.hidden=wanted;

function fmt(ms){
  if(ms<=0)return"READY";
  let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;
  let m=Math.floor(s/60);s%=60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

async function importData(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const parsed=JSON.parse(r.result);
      if(!Array.isArray(parsed)) throw new Error("Format harus berupa array boss");
      const rows=parsed.map(b=>{
        if(!b.name || b.hh===undefined || b.mm===undefined || b.respawn===undefined || b.next===undefined)
          throw new Error("Data boss tidak lengkap");
        return toRow({...b,location:b.location||"Unmapped"});
      });

      const {error:delError}=await sb.from("bosses").delete().not("id","is",null);
      if(delError) throw delError;
      if(rows.length){
        const {error:insError}=await sb.from("bosses").insert(rows);
        if(insError) throw insError;
      }
      await loadBosses();
      alert("Import berhasil");
    }catch(err){
      alert("JSON tidak valid: " + err.message);
    }
  };
  r.readAsText(f);
  e.target.value="";
}

function playBell(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!bellCtx)bellCtx=new AC();
    if(bellCtx.state==="suspended")bellCtx.resume();
    const ctx=bellCtx,now=ctx.currentTime;
    function ding(t,f,d){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.start(t);o.stop(t+d);
    }
    ding(now,880,0.35);
    ding(now+0.45,660,0.45);
  }catch(e){}
}

function render(){
  const q=(($("search")&&$("search").value)||"").trim().toLowerCase();
  const showHidden = window.showHiddenBosses === true;
  bosses.forEach(b=>b.hidden=isHidden(b));
  const now=Date.now();
  const autoVisual=getAutoSpawnVisual();
  let visualChanged=false;
  Object.keys(autoVisual).forEach(id=>{
    if(now>=Number(autoVisual[id])){
      delete autoVisual[id];
      visualChanged=true;
    }
  });
  if(visualChanged) setAutoSpawnVisual(autoVisual);
  const visible=bosses
    .map((b,i)=>({b,i}))
    .filter(x=>(showHidden || !x.b.hidden) && (!q||x.b.name.toLowerCase().includes(q)||(x.b.location||"").toLowerCase().includes(q)))
    .sort((a,b)=>{
      if(sortMode === "name"){
        const collator = new Intl.Collator("en", {numeric:true, sensitivity:"base"});
        return collator.compare(a.b.name||"", b.b.name||"");
      }
      const aVisual=Number(autoVisual[String(a.b.id)])||0;
      const bVisual=Number(autoVisual[String(b.b.id)])||0;
      const aSpawned=(a.b.next<=now)||(a.b.autoKill===true&&aVisual>now);
      const bSpawned=(b.b.next<=now)||(b.b.autoKill===true&&bVisual>now);
      if(aSpawned!==bSpawned) return aSpawned ? -1 : 1;
      return a.b.next-b.b.next;
    });

  $("list").innerHTML=visible.length ? visible.map(({b,i})=>{
    const rem=b.next-now;
    const autoVisual=getAutoSpawnVisual();
    const visualSpawnAt=Number(autoVisual[String(b.id)])||0;
    const showSpawned=(rem<=0)||(b.autoKill===true&&visualSpawnAt>now);
    const cls=showSpawned?"status-ready":rem<1800000?"status-soon":"";

    if(rem>0&&rem<=60000&&!alarmed[b.id]){
      playBell();
      alarmed[b.id]=true;
    }
    if(rem>60000) alarmed[b.id]=false;

    return `<div class="boss-row ${cls}">
      <div class="boss-info">
        <div class="boss-name">${escapeHtml(b.name)}</div>
        <div class="boss-detail">Cycle: <span class="v">${String(b.hh).padStart(2,"0")}:${String(b.mm).padStart(2,"0")}</span> &nbsp;|&nbsp; Respawn: <span class="v">${b.rh}j ${b.rm}m</span></div>
      </div>
      <div class="admin-only"><button class="kill" onclick="kill(${i})">KILL</button></div>
      <div class="warning">${getAutoStatus()[String(b.id)] ? '<span title="[AUTO] time may not be accurate">🔔</span>' : ""}</div>
      <div class="timer">
        <div class="timer-main">${showSpawned?"SPAWNED":fmt(rem)}</div>
        <div class="timer-sub">${new Date(b.next).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}</div>
      </div>
      <div class="actions admin-only">
        <button class="hide" onclick="hideBoss(${i})">${b.hidden?"UNHIDE":"HIDE"}</button>
        <button class="edit" onclick="editBoss(${i})">EDIT</button>
        <button onclick="delBoss(${i})">DELETE</button>
      </div>
    </div>`;
  }).join("") : '<div class="empty">Tidak ada boss.</div>';
}

function escapeHtml(x){
  return String(x).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

function openAddModal(){if(!currentProfile || currentProfile.role!=="admin") return;$("addModal").classList.add("show")}
function closeAddModal(){$("addModal").classList.remove("show")}
if($("search"))$("search").addEventListener("input",render);
updateHistoryButtons();

function openSettingsModal(){
  $("globalAutoKillSeconds").value=globalAutoKillSeconds;
  $("settingsModal").classList.add("show");
}
function closeSettingsModal(){$("settingsModal").classList.remove("show");}
async function saveGlobalAutoKill(){
  if(!currentProfile || currentProfile.role!=="admin") return;
  const seconds=Math.max(0, parseInt($("globalAutoKillSeconds").value,10));
  if(!Number.isFinite(seconds)){alert("Isi angka detik yang valid");return;}
  const old=globalAutoKillSeconds;
  globalAutoKillSeconds=seconds;
  localStorage.setItem(GLOBAL_AUTO_KILL_KEY,String(seconds));
  const {error}=await sb.from("bosses").update({auto_delay:seconds}).not("id","is",null);
  if(error){
    globalAutoKillSeconds=old;
    localStorage.setItem(GLOBAL_AUTO_KILL_KEY,String(old));
    alert("Gagal mengubah Auto Kill Delay: "+error.message);
    return;
  }
  bosses.forEach(b=>b.autoDelay=seconds);
  closeSettingsModal();
  render();
}

async function resetAll(){
  if(!currentProfile || currentProfile.role!=="admin") return;
  if(!confirm("Reset semua boss?")) return;
  const {error:delError}=await sb.from("bosses").delete().not("id","is",null);
  if(delError){alert("Gagal reset: "+delError.message);return;}
  const rows=INITIAL_BOSSES.map(b=>toRow({
    ...b,
    location:b.location||"Unmapped",
    autoKill:true,
    autoDelay:globalAutoKillSeconds
  }));
  const {error:insError}=await sb.from("bosses").insert(rows);
  if(insError){alert("Gagal memasukkan boss awal: "+insError.message);return;}
  await loadBosses();
}

async function autoProcess(){
  const now=Date.now();
  const due=bosses.filter(b=>b.next && now>=b.next+(globalAutoKillSeconds*1000));
  for(const b of due){
    const oldNext=b.next;
    const next=now+b.respawn;
    const visual=getAutoSpawnVisual();
    visual[String(b.id)]=oldNext+SPAWNED_DISPLAY_MS;
    setAutoSpawnVisual(visual);

    // Update the local timer immediately. Do not wait for Supabase/realtime.
    b.next=next;
    render();

    const {error}=await sb.from("bosses")
      .update({next_spawn:next})
      .eq("id",b.id)
      .lt("next_spawn",now+1);

    if(error){
      // If the database update failed, restore the previous timer.
      b.next=oldNext;
      const visual=getAutoSpawnVisual();
      delete visual[String(b.id)];
      setAutoSpawnVisual(visual);
      const status=getAutoStatus();
      delete status[String(b.id)];
      setAutoStatus(status);
      render();
      console.error("Auto-process failed:", error);
    }else{
      const status=getAutoStatus();
      status[String(b.id)]=true;
      setAutoStatus(status);
      render();
    }
  }
}

sb.channel("bosses-sync")
  .on("postgres_changes",{event:"*",schema:"public",table:"bosses"},()=>loadBosses())
  .on("postgres_changes",{event:"*",schema:"public",table:"boss_hidden"},()=>loadBosses())
  .subscribe();

(async()=>{
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(session){
      const profile = await loadCurrentProfile();
      await showAuthenticatedApp(profile);
    }else{
      await showLogin();
    }
  }catch(e){
    console.error(e);
    await sb.auth.signOut();
    await showLogin();
    $("authError").textContent = "Unable to load login. Please refresh and try again.";
  }
  setInterval(async()=>{
    if(!authReady || !currentProfile) return;
    if(currentProfile.role === "admin") await autoProcess();
    render();
  },1000);
})();
</script>
