let bosses = [];
const HIDDEN_KEY = "boss_timer_hidden_bosses_v1";

function setLocalHidden(arr){ localStorage.setItem(HIDDEN_KEY, JSON.stringify(arr)); }
function isHidden(b){ return sharedHidden.has(String(b.id || b.name)); }
let edit = -1;
let alarmed = {};

function fromRow(r){
  return {
    id: r.id,
    name: r.name,
    location: r.location || "Unmapped",
    hh: Number(r.hh) || 0,
    mm: Number(r.mm) || 0,
    rh: Number(r.rh) || 0,
    rm: Number(r.rm) || 0,
    respawn: Number(r.respawn) || 0,
    next: Number(r.next_spawn) || 0,
    autoKill: r.auto_kill !== false,
    autoDelay: Number(r.auto_delay) || 1,
     hidden: isHidden({id:r.id,name:r.name})
  };
}

function toRow(b){
  return {
    name: b.name,
    location: b.location || "Unmapped",
    hh: Number(b.hh) || 0,
    mm: Number(b.mm) || 0,
    rh: Number(b.rh) || 0,
    rm: Number(b.rm) || 0,
    respawn: Number(b.respawn) || 0,
    next_spawn: Number(b.next) || 0,
    auto_kill: b.autoKill !== false,
    auto_delay: Number(b.autoDelay) || 1
  };
}

async function loadBosses(){
  if(loading) return;
  loading = true;
  try{
    const [{data, error}, {data:hiddenRows, error:hiddenError}] = await Promise.all([
      sb.from("bosses").select("*").order("next_spawn", {ascending:true}),
      sb.from("boss_hidden").select("boss_id")
    ]);
    if(error) throw error;
    if(hiddenError) throw hiddenError;
    sharedHidden = new Set((hiddenRows || []).map(r => String(r.boss_id)));

    if(!data || data.length === 0){
      const seed = INITIAL_BOSSES.map(b => toRow({
        ...b,
        location: b.location || "Unmapped",
        autoKill: b.autoKill !== false,
        autoDelay: b.autoDelay === undefined ? 1 : b.autoDelay
      }));
      const {error: seedError} = await sb.from("bosses").insert(seed);
      if(seedError) throw seedError;
      const again = await sb.from("bosses").select("*").order("next_spawn", {ascending:true});
      if(again.error) throw again.error;
      bosses = (again.data || []).map(fromRow);
    }else{
      bosses = data.map(fromRow);
    }
    render();
  }catch(err){
    console.error(err);
    alert("Gagal terhubung ke database Supabase.\n\n" + (err.message || err));
  }finally{
    loading = false;
  }
}

function calcNext(h,m,respawnMs){
  const now=Date.now();
  const base=new Date();
  base.setHours(h,m,0,0);
  let t=base.getTime();
  if(t>now) return t;
  if(respawnMs<=0) return t;
  while(t<=now) t+=respawnMs;
  return t;
}

$("save").onclick = async () => {
  const b = {
    name:$("name").value.trim(),
    location:$("location").value.trim() || "Unmapped",
    hh:+$("hh").value||0,
    mm:+$("mm").value||0,
    rh:+$("rh").value||0,
    rm:+$("rm").value||0,
    autoKill:$("autoKill").checked,
    autoDelay:(+$("autoDelay").value)||0
  };
  if(!b.name){ alert("Isi nama boss"); return; }

  b.respawn=(b.rh*60+b.rm)*60000;
  b.next=calcNext(b.hh,b.mm,b.respawn);

  const {error} = await sb.from("bosses").insert(toRow(b));
  if(error){ alert("Gagal menambah boss: " + error.message); return; }

  closeAddModal();
  ["name","location","hh","mm","rh","rm"].forEach(id=>$(id).value="");
  $("autoDelay").value=1;
  $("autoKill").checked=true;
  await loadBosses();
};

async function kill(i){
  const b=bosses[i];
  if(!b) return;
  const oldNext=b.next;
  const next=Date.now()+b.respawn;

  // Update tampilan langsung supaya KILL terasa responsif.
  b.next=next;
  render();

  const {error}=await sb.from("bosses").update({next_spawn:next}).eq("id",b.id);
  if(error){
    // Kalau update database gagal, kembalikan tampilan ke nilai sebelumnya.
    b.next=oldNext;
    render();
    alert("Gagal KILL: " + error.message);
    return;
  }

  // Pastikan tampilan mengikuti data terbaru dari Supabase.
  await loadBosses();
}

function editBoss(i){
  const b=bosses[i];
  if(!b) return;
  edit=i;
  $("editName").value=b.name;
  $("editLocation").value=b.location||"Unmapped";
  $("editHh").value=b.hh;
  $("editMm").value=b.mm;
  $("editRh").value=b.rh;
  $("editRm").value=b.rm;
  $("editModal").classList.add("show");
}

function closeEditModal(){
  edit=-1;
  $("editModal").classList.remove("show");
}

async function saveEditModal(){
  if(edit<0) return;
  const b=bosses[edit];
  const name=$("editName").value.trim();
  if(!name){ alert("Isi nama boss"); return; }

  const hh=+$("editHh").value||0;
  const mm=+$("editMm").value||0;
  const rh=+$("editRh").value||0;
  const rm=+$("editRm").value||0;
  const respawn=(rh*60+rm)*60000;
  const next=calcNext(hh,mm,respawn);

  const {error}=await sb.from("bosses").update({
    name,
    location:$("editLocation").value.trim()||"Unmapped",
    hh,mm,rh,rm,respawn,next_spawn:next
  }).eq("id",b.id);

  if(error){ alert("Gagal menyimpan: " + error.message); return; }

  // Update the local copy immediately so EDIT is reflected without F5.
  Object.assign(b, {
    name,
    location:$("editLocation").value.trim()||"Unmapped",
    hh, mm, rh, rm, respawn, next_spawn: next
  });
  closeEditModal();
  render();
}

async function hideBoss(i){
  const b=bosses[i];
  if(!b || b.id==null) return;
  const key=String(b.id);
  const currentlyHidden=sharedHidden.has(key);

  if(currentlyHidden){
    const {error}=await sb.from("boss_hidden").delete().eq("boss_id",key);
    if(error){ alert("Gagal unhide: " + error.message); return; }
    sharedHidden.delete(key);
  }else{
    const {error}=await sb.from("boss_hidden").upsert({boss_id:key},{onConflict:"boss_id"});
    if(error){ alert("Gagal hide: " + error.message); return; }
    sharedHidden.add(key);
  }
  b.hidden=!currentlyHidden;
  render();
}

function toggleHidden(){
  window.showHiddenBosses=!window.showHiddenBosses;
  const btn=$("hiddenBtn");
  if(btn) btn.textContent=window.showHiddenBosses?"Hide Hidden":"Show Hidden";
  render();
}

async function delBoss(i){
  const b=bosses[i];
  if(!b) return;
  if(!confirm("Hapus "+b.name+"?")) return;

  const oldBosses = bosses.slice();
  bosses.splice(i, 1);
  render();

  const {error}=await sb.from("bosses").delete().eq("id",b.id);
  if(error){
    bosses = oldBosses;
    render();
    alert("Gagal menghapus: " + error.message);
    return;
  }
}

function fmt(ms){
  if(ms<=0)return"READY";
  let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;
  let m=Math.floor(s/60);s%=60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function exportData(){
  const blob=new Blob([JSON.stringify(bosses,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="bosses.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function importData(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const parsed=JSON.parse(r.result);
      if(!Array.isArray(parsed)) throw new Error("Format harus berupa array boss");
      const rows=parsed.map(b=>{
        if(!b.name || b.hh===undefined || b.mm===undefined || b.respawn===undefined || b.next===undefined)
          throw new Error("Data boss tidak lengkap");
        return toRow({...b,location:b.location||"Unmapped"});
      });

      const {error:delError}=await sb.from("bosses").delete().not("id","is",null);
      if(delError) throw delError;
      if(rows.length){
        const {error:insError}=await sb.from("bosses").insert(rows);
        if(insError) throw insError;
      }
      await loadBosses();
      alert("Import berhasil");
    }catch(err){
      alert("JSON tidak valid: " + err.message);
    }
  };
  r.readAsText(f);
  e.target.value="";
}

function unlockBell(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!bellCtx)bellCtx=new AC();
    if(bellCtx.state==="suspended")bellCtx.resume();
  }catch(e){}
}
document.addEventListener("click",unlockBell);

function playBell(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!bellCtx)bellCtx=new AC();
    if(bellCtx.state==="suspended")bellCtx.resume();
    const ctx=bellCtx,now=ctx.currentTime;
    function ding(t,f,d){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.start(t);o.stop(t+d);
    }
    ding(now,880,0.35);
    ding(now+0.45,660,0.45);
  }catch(e){}
}

function render(){
  const q=(($("search")&&$("search").value)||"").trim().toLowerCase();
  const showHidden = window.showHiddenBosses === true;
  bosses.forEach(b=>b.hidden=isHidden(b));
  const now=Date.now();
  const visible=bosses
    .map((b,i)=>({b,i}))
    .filter(x=>(showHidden || !x.b.hidden) && (!q||x.b.name.toLowerCase().includes(q)||(x.b.location||"").toLowerCase().includes(q)))
    .sort((a,b)=>a.b.next-b.b.next);

  $("list").innerHTML=visible.length ? visible.map(({b,i})=>{
    const rem=b.next-now;
    const cls=rem<=0?"status-ready":rem<1800000?"status-soon":"";

    if(rem>0&&rem<=60000&&!alarmed[b.id]){
      playBell();
      alarmed[b.id]=true;
    }
    if(rem>60000) alarmed[b.id]=false;

    return `<div class="boss-row ${cls}">
      <div class="boss-info">
        <div class="boss-name">${escapeHtml(b.name)}</div>
        <div class="boss-detail">Cycle: <span class="v">${String(b.hh).padStart(2,"0")}:${String(b.mm).padStart(2,"0")}</span> &nbsp;|&nbsp; Respawn: <span class="v">${b.rh}j ${b.rm}m</span></div>
      </div>
      <div><button class="kill" onclick="kill(${i})">KILL</button></div>
      <div class="warning">${rem<=0||rem<1800000?"▲":""}</div>
      <div class="timer">
        <div class="timer-main">${rem<=0?"SPAWNED":fmt(rem)}</div>
        <div class="timer-sub">${new Date(b.next).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div>
      </div>
      <div class="actions">
        <button class="hide" onclick="hideBoss(${i})">${b.hidden?"UNHIDE":"HIDE"}</button>
        <button class="edit" onclick="editBoss(${i})">EDIT</button>
        <button onclick="delBoss(${i})">DELETE</button>
      </div>
    </div>`;
  }).join("") : '<div class="empty">Tidak ada boss.</div>';
}

function escapeHtml(x){
  return String(x).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

function openAddModal(){$("addModal").classList.add("show")}
function closeAddModal(){$("addModal").classList.remove("show")}
if($("search"))$("search").addEventListener("input",render);

async function resetAll(){
  if(!confirm("Reset semua boss?")) return;
  const {error:delError}=await sb.from("bosses").delete().not("id","is",null);
  if(delError){alert("Gagal reset: "+delError.message);return;}
  const rows=INITIAL_BOSSES.map(b=>toRow({
    ...b,
    location:b.location||"Unmapped",
    autoKill:true,
    autoDelay:1
  }));
  const {error:insError}=await sb.from("bosses").insert(rows);
  if(insError){alert("Gagal memasukkan boss awal: "+insError.message);return;}
  await loadBosses();
}

async function autoProcess(){
  const now=Date.now();
  const due=bosses.filter(b=>b.autoKill && b.next && now>=b.next+(b.autoDelay||1)*60000);
  for(const b of due){
    const next=now+b.respawn;
    await sb.from("bosses").update({next_spawn:next}).eq("id",b.id).lt("next_spawn",now+1);
  }
}

sb.channel("bosses-sync")
  .on("postgres_changes",{event:"*",schema:"public",table:"bosses"},()=>loadBosses())
  .on("postgres_changes",{event:"*",schema:"public",table:"boss_hidden"},()=>loadBosses())
  .subscribe();

(async()=>{
  await loadBosses();
  setInterval(async()=>{
    await autoProcess();
    render();
  },1000);
})();
</script>

</body></html>
